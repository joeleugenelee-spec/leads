<h3>Your one goal</h3><p class="goal">Book a 15-minute Google Meet between the business owner and the manager.</p>
<p class="mute">That is the whole job. You do not sell, talk price or take payment. The manager is the closer.</p>
<h3>Who does what</h3><ol>
<li class="me"><b>Top</b><span>You, the cold caller</span><small>Call the business and book a Google Meet with the manager.</small></li>
<li><b>Middle</b><span>The manager</span><small>Meets everyone who booked and shows them the website.</small></li>
<li><b>Bottom</b><span>The manager</span><small>Closes the sale and takes the payment. If the sale closes, you earn your commission.</small></li></ol>
<h3>Before you dial</h3>
<p>Open the business's link and check it has no website. Only say you could not find one if that is true.</p>
<h3>The call, step by step</h3>
<ol class="steps2">
<li><b>1. Open like a person, not a pitch.</b><span class="say">"Hey, is this [owner's name]? It's [your name]. Quick one: I was looking up [business] online. Where do your customers usually find you right now?"</span><small>Do not ask for "30 seconds of your time". Ask the question and listen.</small></li>
<li><b>2. Name the gap you saw.</b><span class="say">"Got it. When I searched, I found your Google listing but no website. If I'm picking between you and a competitor with a site and more reviews, what makes me call you? Is that something you run into, or not really?"</span><small>Most will say "we're word of mouth". That is fine. Do not argue.</small></li>
<li><b>3. Take the pressure off, then ask about growth.</b><span class="say">"Fair enough, this may not even be relevant for you. Let me ask one thing: if a few more customers came in each week, could you handle that, or would it be too much right now?"</span><small>You are asking, not pitching. If they say they are full, thank them and move on.</small></li>
<li><b>4. Assume the meeting.</b><span class="say">"Then it's worth 15 minutes. We build websites for businesses like yours, and our manager can show you what one would look like for [business] on a quick Google Meet. Worst case, you see what's possible. Are mornings or afternoons better for you?"</span><small>Offer two choices, not a yes or no. Pick the earliest free slot on the manager's calendar, today or tomorrow if you can.</small></li>
<li><b>5. Lock it in.</b><span class="say">"Great, I've got [day] at [time]. What's the best email for the invite? You'll get a Google Meet link from our manager."</span><small>Then press Check off and "Booked a call" and fill in their name, email and the time. The booking stays yours.</small></li></ol>
<h3>If they ask</h3>
<p><b>"How much is it?"</b> "Our manager goes through that on the Meet once they've seen what you need. I just set up the time."</p>
<p><b>"Send me an email instead."</b> "Happy to. It's quicker to see it, though, and it's only 15 minutes. Does [day] morning work?"</p>
<p><b>"Not interested."</b> Thank them, then press Check off and "No booking". Never push past a clear no, and if they ask not to be called again, do not call again.</p>
<p><b>Nobody picked up:</b> press Check off, then "No answer". It stays on your list to try again.</p>
<p class="warn">Keep it true. Do not say a website has already been made for them unless the manager has confirmed one exists for that business. Do not make up search results, numbers or reasons to rush. Do not promise they will make more money.</p></div></details>`;

  if(A.tab==='done'&&done.length){
    const trs=[...view.querySelectorAll('tbody tr')], go=()=>{const w=$('#dw').value,o=$('#do').value,q=$('#dq').value.toLowerCase();let k=0;
      trs.forEach(x=>{const ok=(!w||x.dataset.w===w)&&(!o||x.dataset.o===o)&&x.textContent.toLowerCase().includes(q);x.hidden=!ok;if(ok)k++});$('#dcnt').textContent=k+' shown'};
    $('#dw').onchange=go;$('#do').onchange=go;$('#dq').oninput=go;go();
  }
  if(A.tab==='leads'){
    const trs=[...view.querySelectorAll('tbody tr')], boxes=()=>trs.filter(r=>!r.hidden).map(r=>r.querySelector('input'));
    const picked=()=>trs.map(r=>r.querySelector('input')).filter(b=>b.checked).map(b=>+b.value);
    const count=()=>{$('#seln').textContent=picked().length+' selected'};
    const go=()=>{const hh=$('#lh').value,t=$('#lt').value,r=$('#lr').value,s=$('#lq').value.toLowerCase();let k=0;
      trs.forEach(x=>{const ok=(!hh||x.dataset.h===hh)&&(!t||x.dataset.t===t)&&(!r||x.dataset.r===r)&&x.textContent.toLowerCase().includes(s);x.hidden=!ok;if(!ok)x.querySelector('input').checked=false;if(ok)k++});
      $('#lcnt').textContent=k+' shown';count()};
    ['lh','lt','lr'].forEach(i=>$('#'+i).onchange=go);$('#lq').oninput=go;
    $('#selall').onclick=()=>{boxes().forEach(b=>b.checked=true);count()};$('#selnone').onclick=()=>{trs.forEach(r=>r.querySelector('input').checked=false);count()};
    view.querySelector('tbody').onchange=count;
    $('#give').onclick=()=>{const ids=picked(),to=$('#to').value;if(!ids.length||!to){A.note=['Select some leads and a caller first.','bad'];return say($('#note'),...A.note)}
      act(sb.rpc('admin_assign_ids',{p_caller:to,p_ids:ids}),d=>d===ids.length?`Assigned ${d} leads.`:`Assigned ${d} of ${ids.length}; the rest already belong to someone. Unassign them first to move them.`)};
    $('#take').onclick=()=>{const ids=picked();if(!ids.length){A.note=['Select some leads first.','bad'];return say($('#note'),...A.note)}act(sb.rpc('admin_unassign_ids',{p_ids:ids}),d=>`Unassigned ${d} leads.`)};
    go();
  }
}
</script><script src="discord.js?v=2"></script></body></html>
